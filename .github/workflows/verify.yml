name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Test
        run: docker build --tag anilist:ci .
      - name: Check Installed Executable
        run: docker run --rm anilist:ci --help
